name: Test Egress Audit Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/egress-audit-20261111
    paths:
      - scripts/audit_egress.py
      - scripts/render_verified_candidate.py
      - scripts/prepare_isolated_audit.py
      - scripts/subscription_snapshot.py
      - scripts/reconcile_subscription.py
      - scripts/ai_dynamic_refresh_planner.py
      - scripts/render_ai_only_candidate.py
      - tests/test_render_ai_only_candidate.py
      - docs/AI_DYNAMIC_MONITOR_DESIGN_20261113.md
      - scripts/inspect_active_subscription.rb
      - scripts/prepare_local_probe.rb
      - scripts/prepare_local_probe_core.rb
      - scripts/ai_subscription_inventory.rb
      - scripts/ai_regional_pools.rb
      - scripts/ai_source_link_readonly.sh
      - scripts/ai_service_reachability_pilot.sh
      - scripts/ai_network_batch_once.sh
      - list/AI.list
      - Clash-Li.ini
      - generated/Clash-Meta-Android.template.yaml
      - docs/AI_THREE_CLIENT_COMPATIBILITY_20261113.md
      - tests/test_shared_three_client_contract.py
      - tests/test_audit_egress.py
      - tests/test_render_verified_candidate.py
      - tests/test_prepare_isolated_audit.py
      - tests/test_subscription_snapshot.py
      - tests/test_reconcile_subscription.py
      - tests/test_ai_dynamic_refresh_planner.py
      - tests/test_inspect_active_subscription.py
      - tests/test_prepare_local_probe.py
      - tests/test_prepare_local_probe_core.py
      - tests/test_ai_subscription_inventory.rb
      - tests/test_ai_regional_pools.rb
      - tests/test_notebooklm_redirect_gate.py
      - .github/workflows/check-egress-candidate.yml
  pull_request:
    paths:
      - scripts/audit_egress.py
      - scripts/render_verified_candidate.py
      - scripts/prepare_isolated_audit.py
      - scripts/subscription_snapshot.py
      - scripts/reconcile_subscription.py
      - scripts/ai_dynamic_refresh_planner.py
      - scripts/render_ai_only_candidate.py
      - tests/test_render_ai_only_candidate.py
      - docs/AI_DYNAMIC_MONITOR_DESIGN_20261113.md
      - scripts/inspect_active_subscription.rb
      - scripts/prepare_local_probe.rb
      - scripts/prepare_local_probe_core.rb
      - scripts/ai_subscription_inventory.rb
      - scripts/ai_regional_pools.rb
      - scripts/ai_source_link_readonly.sh
      - scripts/ai_service_reachability_pilot.sh
      - scripts/ai_network_batch_once.sh
      - list/AI.list
      - Clash-Li.ini
      - generated/Clash-Meta-Android.template.yaml
      - docs/AI_THREE_CLIENT_COMPATIBILITY_20261113.md
      - tests/test_shared_three_client_contract.py
      - tests/test_audit_egress.py
      - tests/test_render_verified_candidate.py
      - tests/test_prepare_isolated_audit.py
      - tests/test_subscription_snapshot.py
      - tests/test_reconcile_subscription.py
      - tests/test_ai_dynamic_refresh_planner.py
      - tests/test_inspect_active_subscription.py
      - tests/test_prepare_local_probe.py
      - tests/test_prepare_local_probe_core.py
      - tests/test_ai_subscription_inventory.rb
      - tests/test_ai_regional_pools.rb

permissions:
  contents: read

jobs:
  unit-and-cross-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated-audit YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Ruby iStoreOS census syntax
        run: ruby -c scripts/inspect_active_subscription.rb && ruby -c scripts/prepare_local_probe.rb && ruby -c scripts/prepare_local_probe_core.rb && ruby -c scripts/ai_subscription_inventory.rb && ruby -c scripts/ai_regional_pools.rb
      - name: Full-subscription inventory Ruby tests
        run: ruby -I scripts tests/test_ai_subscription_inventory.rb && ruby -I scripts tests/test_ai_regional_pools.rb
      - name: Read-only source provenance TTYD snippet syntax
        run: |
          sh -n scripts/ai_source_link_readonly.sh
          sed '1d;$d' scripts/ai_source_link_readonly.sh > /tmp/ai_source_link_readonly.rb
          ruby -c /tmp/ai_source_link_readonly.rb
      - name: Isolated AI site reachability pilot shell and embedded Ruby syntax
        run: |
          sh -n scripts/ai_service_reachability_pilot.sh
          python - <<'PY'
          import pathlib, re, subprocess
          source = pathlib.Path('scripts/ai_service_reachability_pilot.sh').read_text()
          for tag in ('RUBY_PREP','RUBY_CLEAN'):
              match = re.search(r"<<'" + tag + r"'\n(.*?)\n" + tag + r"(?=\n|$)", source, re.S)
              assert match, tag
              subprocess.run(['ruby', '-c'], input=match.group(1), text=True, check=True)
          print('PILOT_SYNTAX=PASS')
          PY
      - name: AI all-pool bounded batch and incomplete-HTTP classifier tests
        run: |
          sh -n scripts/ai_network_batch_once.sh
          TEST_CLASSIFIER=1 sh scripts/ai_network_batch_once.sh
          TEST_GEO_CLASSIFIER=1 sh scripts/ai_network_batch_once.sh
          python - <<'PY'
          import pathlib, re, subprocess
          source = pathlib.Path('scripts/ai_network_batch_once.sh').read_text()
          for tag in ('RUBY_PREP','RUBY_CLEAN'):
              match = re.search(r"<<'" + tag + r"'\n(.*?)\n" + tag + r"(?=\n|$)", source, re.S)
              assert match, tag
              subprocess.run(['ruby', '-c'], input=match.group(1), text=True, check=True)
          print('BATCH_SYNTAX=PASS')
          PY
      - name: NotebookLM redirect/access gate regression
        run: |
          python -m unittest discover -s tests -p test_notebooklm_redirect_gate.py -v
          python - <<'PY'
          import pathlib,re,subprocess
          s=pathlib.Path('scripts/ai_network_batch_once.sh').read_text()
          m=re.search(r"<<'RUBY_NOTEBOOK'\n(.*?)\nRUBY_NOTEBOOK(?=\n|$)",s,re.S)
          assert m,'missing NotebookLM classifier'
          subprocess.run(['ruby','-c'],input=m.group(1),text=True,check=True)
          PY
      - name: Dynamic subscription AI qualification reconciliation tests
        run: python -m unittest discover -s tests -p test_ai_dynamic_refresh_planner.py -v
      - name: AI-only candidate preserves non-AI rules across Android and Shadowrocket
        run: python -m unittest discover -s tests -p test_render_ai_only_candidate.py -v
      - name: Shared converter baseline and Android/iOS isolation gate
        run: python -m unittest discover -s tests -p test_shared_three_client_contract.py -v
      - name: Compile scripts
        run: python -m py_compile scripts/audit_egress.py scripts/render_verified_candidate.py scripts/prepare_isolated_audit.py scripts/subscription_snapshot.py scripts/reconcile_subscription.py scripts/ai_dynamic_refresh_planner.py scripts/render_ai_only_candidate.py
      - name: Unit and existing generator integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
