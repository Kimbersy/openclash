name: Test Egress Audit Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/egress-audit-20261111
    paths:
      - scripts/audit_egress.py
      - scripts/render_verified_candidate.py
      - scripts/prepare_isolated_audit.py
      - scripts/subscription_snapshot.py
      - scripts/reconcile_subscription.py
      - scripts/inspect_active_subscription.rb
      - scripts/prepare_local_probe.rb
      - scripts/prepare_local_probe_core.rb
      - scripts/ai_subscription_inventory.rb
      - tests/test_audit_egress.py
      - tests/test_render_verified_candidate.py
      - tests/test_prepare_isolated_audit.py
      - tests/test_subscription_snapshot.py
      - tests/test_reconcile_subscription.py
      - tests/test_inspect_active_subscription.py
      - tests/test_prepare_local_probe.py
      - tests/test_prepare_local_probe_core.py
      - tests/test_ai_subscription_inventory.rb
      - .github/workflows/check-egress-candidate.yml
  pull_request:
    paths:
      - scripts/audit_egress.py
      - scripts/render_verified_candidate.py
      - scripts/prepare_isolated_audit.py
      - scripts/subscription_snapshot.py
      - scripts/reconcile_subscription.py
      - scripts/inspect_active_subscription.rb
      - scripts/prepare_local_probe.rb
      - scripts/prepare_local_probe_core.rb
      - scripts/ai_subscription_inventory.rb
      - tests/test_audit_egress.py
      - tests/test_render_verified_candidate.py
      - tests/test_prepare_isolated_audit.py
      - tests/test_subscription_snapshot.py
      - tests/test_reconcile_subscription.py
      - tests/test_inspect_active_subscription.py
      - tests/test_prepare_local_probe.py
      - tests/test_prepare_local_probe_core.py
      - tests/test_ai_subscription_inventory.rb

permissions:
  contents: read

jobs:
  unit-and-cross-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated-audit YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Ruby iStoreOS census syntax
        run: ruby -c scripts/inspect_active_subscription.rb && ruby -c scripts/prepare_local_probe.rb && ruby -c scripts/prepare_local_probe_core.rb && ruby -c scripts/ai_subscription_inventory.rb
      - name: Full-subscription inventory Ruby tests
        run: ruby -I scripts tests/test_ai_subscription_inventory.rb
      - name: Compile scripts
        run: python -m py_compile scripts/audit_egress.py scripts/render_verified_candidate.py scripts/prepare_isolated_audit.py scripts/subscription_snapshot.py scripts/reconcile_subscription.py
      - name: Unit and existing generator integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
