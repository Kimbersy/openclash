permissions:
  contents: read

jobs:
  unit-and-cross-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated-audit YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Ruby iStoreOS census syntax
        run: ruby -c scripts/inspect_active_subscription.rb && ruby -c scripts/prepare_local_probe.rb && ruby -c scripts/prepare_local_probe_core.rb && ruby -c scripts/ai_subscription_inventory.rb && ruby -c scripts/ai_regional_pools.rb
      - name: Full-subscription inventory Ruby tests
        run: ruby -I scripts tests/test_ai_subscription_inventory.rb && ruby -I scripts tests/test_ai_regional_pools.rb
      - name: Read-only source provenance TTYD snippet syntax
        run: |
          sh -n scripts/ai_source_link_readonly.sh
          sed '1d;$d' scripts/ai_source_link_readonly.sh > /tmp/ai_source_link_readonly.rb
          ruby -c /tmp/ai_source_link_readonly.rb
      - name: Isolated AI site reachability pilot shell and embedded Ruby syntax
        run: |
          sh -n scripts/ai_service_reachability_pilot.sh
          python - <<'PY'
          import pathlib, re, subprocess
          source = pathlib.Path('scripts/ai_service_reachability_pilot.sh').read_text()
          for tag in ('RUBY_PREP','RUBY_CLEAN'):
              match = re.search(r"<<'" + tag + r"'\n(.*?)\n" + tag + r"(?=\n|$)", source, re.S)
              assert match, tag
              subprocess.run(['ruby', '-c'], input=match.group(1), text=True, check=True)
          print('PILOT_SYNTAX=PASS')
          PY
      - name: AI all-pool bounded batch and incomplete-HTTP classifier tests
        run: |
          sh -n scripts/ai_network_batch_once.sh
          TEST_CLASSIFIER=1 sh scripts/ai_network_batch_once.sh
          TEST_GEO_CLASSIFIER=1 sh scripts/ai_network_batch_once.sh
          python - <<'PY'
          import pathlib, re, subprocess
          source = pathlib.Path('scripts/ai_network_batch_once.sh').read_text()
          for tag in ('RUBY_PREP','RUBY_CLEAN'):
              match = re.search(r"<<'" + tag + r"'\n(.*?)\n" + tag + r"(?=\n|$)", source, re.S)
              assert match, tag
              subprocess.run(['ruby', '-c'], input=match.group(1), text=True, check=True)
          print('BATCH_SYNTAX=PASS')
          PY
      - name: NotebookLM redirect/access gate regression
        run: |
          python -m unittest discover -s tests -p test_notebooklm_redirect_gate.py -v
          python - <<'PY'
          import pathlib,re,subprocess
          s=pathlib.Path('scripts/ai_network_batch_once.sh').read_text()
          m=re.search(r"<<'RUBY_NOTEBOOK'\n(.*?)\nRUBY_NOTEBOOK(?=\n|$)",s,re.S)
          assert m,'missing NotebookLM classifier'
          subprocess.run(['ruby','-c'],input=m.group(1),text=True,check=True)
          PY
      - name: AI-only post-update multi-signal transition fail-closed tests
        run: python -m unittest discover -s tests -p test_ai_refresh_transition_gate.py -v
      - name: Reject non-authenticated OpenClash update and Mihomo reload evidence
        run: python -m unittest discover -s tests -p test_ai_refresh_event_gate.py -v
      - name: Private input AI service business proof and sticky failover DRY_RUN regression
        run: |
          python -m py_compile scripts/ai_service_stability_dry_run.py
          python -m unittest discover -s tests -p test_ai_service_stability_dry_run.py -v
      - name: Dynamic subscription AI qualification reconciliation tests
        run: python -m unittest discover -s tests -p test_ai_dynamic_refresh_planner.py -v
      - name: Minimal iStoreOS Ruby-core SHA1 16KB Git blob cross-check against standard Digest
        run: |
          sh -n scripts/ai_updater_sha1_core_readonly.sh
          python - <<'PY'
          import pathlib, re, subprocess
          s = pathlib.Path('scripts/ai_updater_sha1_core_readonly.sh').read_text()
          match = re.search(r"ruby <<'RUBY'\n(.*?)\nRUBY(?=\n|$)", s, re.S)
          assert match
          subprocess.run(['ruby','-c'],input=match.group(1),text=True,check=True)
          PY
          ruby -I scripts tests/test_ai_updater_sha1_core_readonly.rb
          output="$(sh scripts/ai_updater_sha1_core_readonly.sh)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^UPDATER_FINGERPRINT=START READ_ONLY=YES'
          printf '%s\n' "$output" | grep -q '^INSTALLED_UPDATER='
          printf '%s\n' "$output" | grep -q '^UPDATER_FINGERPRINT=FINISHED PRODUCTION_WRITES=NONE'
      - name: Short iStoreOS installed updater fingerprint no-network preflight smoke
        run: |
          sh -n scripts/ai_installed_updater_preflight_readonly.sh
          python - <<'PY'
          import pathlib, re, subprocess
          text=pathlib.Path('scripts/ai_installed_updater_preflight_readonly.sh').read_text()
          m=re.search(r"<<'RUBY'\n(.*?)\nRUBY(?=\n|$)",text,re.S)
          assert m, 'missing inline Ruby'
          subprocess.run(['ruby','-c'],input=m.group(1),text=True,check=True)
          assert 'curl ' not in text and 'wget ' not in text
          PY
          output="$(sh scripts/ai_installed_updater_preflight_readonly.sh)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^UPDATER_PREFLIGHT=START READ_ONLY=YES'
          printf '%s\n' "$output" | grep -q '^INSTALLED_UPDATER='
          printf '%s\n' "$output" | grep -q '^KERNEL_AT_CLKTCK='
          printf '%s\n' "$output" | grep -q '^UPDATER_PREFLIGHT=FINISHED PRODUCTION_WRITES=NONE'
      - name: Minimal 0.47.151 postcommit failure and rollback DRY_RUN checks
        run: |
          python -m py_compile scripts/ai_047151_postcommit_dryrun.py
          python -m unittest discover -s tests -p test_ai_047151_postcommit_dryrun.py -v
      - name: Exact upstream updater version and protected postcommit contract safety
        run: |
          python -m py_compile scripts/ai_openclash_updater_contract.py
          python -m unittest discover -s tests -p test_ai_openclash_updater_contract.py -v
      - name: Kernel auxv clock and natural update chronology never fake runtime proof
        run: |
          ruby -c scripts/ai_proc_clock_readonly.rb
          ruby -I scripts tests/test_ai_proc_clock_readonly.rb
          python -m py_compile scripts/ai_refresh_causal_sequence.py
          python -m unittest discover -s tests -p test_ai_refresh_causal_sequence.py -v
      - name: Read-only update success + post-update core activation evidence safety gate
        run: ruby -c scripts/ai_refresh_activation_gate_readonly.rb && ruby -I scripts tests/test_ai_refresh_activation_gate_readonly.rb
      - name: Read-only OpenClash updater log evidence classifier
        run: ruby -c scripts/ai_refresh_log_evidence.rb && ruby -I scripts tests/test_ai_refresh_log_evidence.rb
      - name: Combined read-only update and live core evidence bundle syntax
        run: ruby -c scripts/ai_refresh_live_evidence_bundle_readonly.rb
      - name: iStoreOS mobile inline no-download Ruby/Psych evidence bundle smoke
        run: |
          sh -n scripts/ai_mobile_evidence_readonly.sh
          sed '1,4d;$d' scripts/ai_mobile_evidence_readonly.sh | ruby -c
          ! grep -q "require 'time'" scripts/ai_mobile_evidence_readonly.sh
          output="$(sh scripts/ai_mobile_evidence_readonly.sh)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^POST_UPDATE_ACTIVATION_EVIDENCE='
          printf '%s\n' "$output" | grep -q '^LIVE_API='
          if printf '%s\n' "$output" | grep -q '^LIVE_API=READ_ONLY_GET_SUCCESS'; then
            printf '%s\n' "$output" | grep -q '^LIVE_PROXY_NAME_COVERAGE='
          else
            ! printf '%s\n' "$output" | grep -q '^LIVE_API=READ_ONLY_GET_SUCCESS'
          fi
          printf '%s\n' "$output" | grep -q 'PRODUCTION_WRITES=NONE'
      - name: iStoreOS anonymous post-receipt core clock and extra-node follow-up tests
        run: |
          sh -n scripts/ai_mobile_followup_readonly.sh
          sed '1,4d;$d' scripts/ai_mobile_followup_readonly.sh | ruby -c
          ruby -I scripts tests/test_ai_mobile_followup_readonly.rb
          output="$(sh scripts/ai_mobile_followup_readonly.sh)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q '^FOLLOWUP=START READ_ONLY=YES'
          printf '%s\n' "$output" | grep -q '^FOLLOWUP=FINISHED PRODUCTION_WRITES=NONE AI_SWITCH=NONE'
      - name: Live Mihomo loopback GET snapshot read-only safety tests
        run: ruby -c scripts/ai_live_membership_readonly.rb && ruby -I scripts tests/test_ai_live_membership_readonly.rb
      - name: Read-only OpenClash subscription schedule and refresh provenance gate
        run: ruby -c scripts/ai_refresh_schedule_readonly.rb && ruby -I scripts tests/test_ai_refresh_schedule_readonly.rb
      - name: Native Mihomo v1.19.34 parser validates synthetic one-core loopback listener
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai-probe-native
          curl -fLsS --retry 2 --connect-timeout 10 --max-time 120 \
            -o /tmp/ai-probe-native/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-linux-amd64-compatible-v1.19.34.gz
          printf '%s  %s\n' \
            '2763f5b414527f7baf6dc57e3f82f3ab561eedf34bfd7c2f2cde1f7e592efe06' \
            /tmp/ai-probe-native/mihomo.gz | sha256sum -c -
          gzip -dc /tmp/ai-probe-native/mihomo.gz > /tmp/ai-probe-native/mihomo
          chmod 700 /tmp/ai-probe-native/mihomo
          python tests/make_ai_notebook_native_mihomo_fixture.py /tmp/ai-probe-native/config.yaml
          /tmp/ai-probe-native/mihomo -t -f /tmp/ai-probe-native/config.yaml
          ruby -e 'load ARGV[0]; print AiNotebookNativeCapability.synthetic_yaml' scripts/ai_notebook_native_capability_test.rb > /tmp/ai-probe-native/native-ruby.yaml
          /tmp/ai-probe-native/mihomo -t -d /tmp/ai-probe-native -f /tmp/ai-probe-native/native-ruby.yaml
      - name: Version-string-independent native -t capability gate with isolated synthetic fixture
        run: |
          ruby -c scripts/ai_notebook_native_capability_test.rb
          ruby tests/test_ai_notebook_native_capability_test.rb
      - name: Real iStoreOS core version-only diagnostic, no stdout/stderr leakage
        run: |
          ruby -c scripts/ai_mihomo_version_only_readonly.rb
          ruby tests/test_ai_mihomo_version_only_readonly.rb
      - name: iStoreOS minimal-runtime dependency contract (real-device allowlist)
        run: |
          python -m unittest discover -s tests -p test_istoreos_runtime_contract.py -v
      - name: Router read-only Notebook preflight checks installed core and port without private logs
        run: |
          ruby -c scripts/ai_notebook_router_admission_readonly.rb
          ruby tests/test_ai_notebook_router_admission_readonly.rb
      - name: One-core native loopback Notebook probing entrance and zero-non-AI-change tests
        run: |
          python -m py_compile scripts/ai_notebook_one_core_probe_candidate.py
          python -m unittest discover -s tests -p test_ai_notebook_one_core_probe_candidate.py -v
      - name: Low-power one-shot Notebook CTA HTTPS redirect precheck (no browser)
        run: |
          ruby -c scripts/ai_notebooklm_cta_light_probe.rb
          ruby -I scripts tests/test_ai_notebooklm_cta_light_probe.rb
      - name: Three AI websites and NotebookLM browser import same-exit acceptance DRY_RUN
        run: |
          python -m py_compile scripts/ai_three_service_browser_flow_gate.py
          python -m unittest discover -s tests -p test_ai_three_service_browser_flow_gate.py -v
      - name: Router P0 all AI service pools, dynamic real-egress countries and incremental refresh dry run
        run: |
          python -m py_compile scripts/ai_full_region_refresh_dry_run.py
          python -m unittest discover -s tests -p test_ai_full_region_refresh_dry_run.py -v
      - name: Router P0 independent AI-only fallback and non-AI invariance regression
        run: |
          python -m py_compile scripts/build_router_ai_p0_candidate.py
          python -m unittest discover -s tests -p test_build_router_ai_p0_candidate.py -v
      - name: AI-only candidate preserves non-AI rules across Android and Shadowrocket
        run: python -m unittest discover -s tests -p test_render_ai_only_candidate.py -v
      - name: Shared converter baseline and Android/iOS isolation gate
        run: python -m unittest discover -s tests -p test_shared_three_client_contract.py -v
      - name: Compile scripts
        run: python -m py_compile scripts/audit_egress.py scripts/render_verified_candidate.py scripts/prepare_isolated_audit.py scripts/subscription_snapshot.py scripts/reconcile_subscription.py scripts/ai_dynamic_refresh_planner.py scripts/render_ai_only_candidate.py scripts/ai_refresh_event_gate.py scripts/ai_refresh_transition_gate.py
      - name: Unit and existing generator integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
