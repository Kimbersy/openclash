name: Generate Client Configs

on:
  workflow_dispatch:

  push:
    branches:
      - automation-test
      - main
    paths:
      - "Clash-Li.ini"
      - "scripts/generate_shadowrocket.py"
      - "scripts/generate_android.py"
      - ".github/workflows/generate-shadowrocket.yml"

permissions:
  contents: write

concurrency:
  group: generate-client-configs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Check Python scripts
        run: |
          python -m py_compile scripts/generate_shadowrocket.py
          python -m py_compile scripts/generate_android.py

      - name: Check health-check URLs
        run: |
          if grep -q "http://www.gstatic.com/generate_204" Clash-Li.ini; then
            echo "ERROR: Clash-Li.ini contains insecure HTTP health-check URLs."
            echo "Please use https://www.gstatic.com/generate_204"
            exit 1
          fi

      - name: Generate Shadowrocket config
        run: |
          python scripts/generate_shadowrocket.py

      - name: Generate Android Mihomo template
        run: |
          python scripts/generate_android.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          sr = Path("generated/Shadowrocket.conf")
          android = Path("generated/Clash-Meta-Android.template.yaml")

          if not sr.exists():
              raise SystemExit("Shadowrocket.conf was not generated")

          if not android.exists():
              raise SystemExit("Android YAML was not generated")

          sr_text = sr.read_text(encoding="utf-8")

          for section in [
              "[General]",
              "[Proxy Group]",
              "[Rule]",
          ]:
              if section not in sr_text:
                  raise SystemExit(
                      f"Shadowrocket.conf missing {section}"
                  )

          android_text = android.read_text(encoding="utf-8")

          if "__AIRPORT_URL__" not in android_text:
              raise SystemExit(
                  "Android template missing __AIRPORT_URL__"
              )

          config = yaml.safe_load(android_text)

          for key in [
              "proxy-providers",
              "proxy-groups",
              "rule-providers",
              "rules",
          ]:
              if key not in config:
                  raise SystemExit(
                      f"Android YAML missing {key}"
                  )

          group_names = {
              group["name"]
              for group in config["proxy-groups"]
          }

          required_groups = {
              "🤖 AI",
              "🍎 AppleTV+",
              "🧿 Steam",
              "💳 PayPal",
              "🇺🇸美国",
              "🤖 美国-Gemini",
              "⚠️ 特殊计费节点",
              "🏷️ 优惠倍率节点",
          }

          missing = required_groups - group_names

          if missing:
              raise SystemExit(
                  "Android YAML missing groups: "
                  + ", ".join(sorted(missing))
              )

          print("Generated configuration validation passed.")
          PY

      - name: Show generated files
        run: |
          echo "===== Generated files ====="
          ls -lah generated

          echo
          echo "===== Android preview ====="
          head -n 40 generated/Clash-Meta-Android.template.yaml

          echo
          echo "===== Shadowrocket preview ====="
          head -n 30 generated/Shadowrocket.conf

      - name: Commit generated configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            generated/Shadowrocket.conf \
            generated/Clash-Meta-Android.template.yaml

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Auto-generate client configs"
            git push
          fi
